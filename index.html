<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBX Files - Área de Downloads</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: #1e1e24;
            --primary-blue: #2563eb;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --border-color: #333338;
            --yt-red: #ff0000;
            --green: #16a34a;
            --red: #dc2626;
            --star-color: #fbbf24;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            border-bottom: 1px solid var(--border-color);
        }

        .logo { font-size: 24px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .logo span { color: var(--primary-blue); }

        .header-buttons { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

        .yt-btn {
            background-color: var(--yt-red); color: white; text-decoration: none; padding: 8px 16px;
            border-radius: 6px; font-weight: bold; font-size: 14px; display: flex; align-items: center; transition: 0.2s;
        }
        .yt-btn:hover { background-color: #cc0000; }

        .admin-btn {
            display: none; background-color: #27272a; color: white; border: 1px solid var(--border-color);
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 14px;
        }
        body.dono-logado .admin-btn { display: inline-block; }
        .admin-btn:hover { background-color: #3f3f46; }
        .admin-btn.logado { background-color: #7f1d1d; border-color: #991b1b; }
        .admin-btn.logado:hover { background-color: #991b1b; }

        .user-btn {
            background-color: var(--primary-blue); color: white; border: none; padding: 8px 16px;
            border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 14px;
        }
        .user-btn:hover { background-color: #1d4ed8; }
        .user-btn.logado { background-color: var(--green); }
        .user-btn.logado:hover { background-color: #15803d; }
        .user-btn.dono { background-color: #7c3aed; }
        .user-btn.dono:hover { background-color: #6d28d9; }

        main { width: 100%; max-width: 800px; padding: 20px; box-sizing: border-box; }

        /* ===== PAINEL ADMIN ===== */
        #admin-panel {
            display: none; background-color: var(--card-bg); border: 1px solid var(--primary-blue);
            padding: 20px; border-radius: 10px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
        }
        #admin-panel h3 { margin-top: 0; color: var(--primary-blue); }

        input, textarea {
            width: 100%; padding: 12px; margin-bottom: 15px; background-color: #27272a;
            border: 1px solid var(--border-color); color: white; border-radius: 6px;
            box-sizing: border-box; font-family: inherit;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--primary-blue); }

        .file-options, .image-options {
            background-color: #27272a; border: 1px dashed var(--border-color);
            border-radius: 8px; padding: 15px; margin-bottom: 15px;
        }
        .file-options label, .image-options label {
            display: block; font-size: 14px; color: var(--text-muted); margin-bottom: 8px; font-weight: bold;
        }

        .galeria-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background-color: #3f3f46; color: white; border: none; padding: 12px 20px; border-radius: 6px;
            font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; margin-bottom: 10px;
        }
        .galeria-btn:hover { background-color: #52525b; }

        .divider-text {
            text-align: center; color: var(--text-muted); font-size: 12px; margin: 8px 0;
            text-transform: uppercase; letter-spacing: 1px;
        }

        .preview-img {
            width: 100%; max-height: 150px; object-fit: cover; border-radius: 6px; margin-top: 10px;
            display: none; border: 1px solid var(--border-color);
        }

        .publish-btn {
            background-color: var(--primary-blue); color: white; border: none; padding: 12px; width: 100%;
            border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .publish-btn:hover { background-color: #1d4ed8; }

        /* ===== MODAL LOGIN/CADASTRO ===== */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.75); z-index: 1000; justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box; backdrop-filter: blur(4px);
        }
        .modal-overlay.ativo { display: flex; }

        .modal-box {
            background-color: var(--card-bg); border: 1px solid var(--primary-blue); border-radius: 12px;
            padding: 25px; width: 100%; max-width: 400px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }
        .modal-box h2 { margin-top: 0; color: var(--primary-blue); text-align: center; }

        .modal-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .modal-tab {
            flex: 1; padding: 10px; background-color: #27272a; border: 1px solid var(--border-color);
            color: var(--text-muted); border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .modal-tab.active { background-color: var(--primary-blue); color: white; border-color: var(--primary-blue); }

        .modal-form { display: none; }
        .modal-form.active { display: block; }

        .fechar-modal {
            background-color: #3f3f46; color: white; border: none; padding: 10px; width: 100%;
            border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.2s;
        }
        .fechar-modal:hover { background-color: #52525b; }

        /* ===== BARRA DE PESQUISA ===== */
        .search-container { position: relative; margin-bottom: 25px; }
        .search-input {
            width: 100%; padding: 14px 45px 14px 16px; background-color: var(--card-bg);
            border: 1px solid var(--border-color); color: white; border-radius: 10px; font-size: 15px;
            box-sizing: border-box; margin: 0;
        }
        .search-input:focus { border-color: var(--primary-blue); outline: none; }
        .search-icon {
            position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
            font-size: 18px; color: var(--text-muted); pointer-events: none;
        }
        .search-locked {
            background-color: var(--card-bg); border: 1px dashed var(--border-color); border-radius: 10px;
            padding: 16px; text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 25px;
        }
        .search-locked button {
            background-color: var(--primary-blue); color: white; border: none; padding: 8px 16px;
            border-radius: 6px; font-weight: bold; cursor: pointer; margin-left: 8px; transition: 0.2s;
        }
        .search-locked button:hover { background-color: #1d4ed8; }

        /* ===== CARDS DE ARQUIVOS ===== */
        .script-card {
            background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
            overflow: hidden; margin-bottom: 25px; position: relative;
        }
        .delete-btn {
            display: none; position: absolute; top: 10px; right: 10px; background-color: rgba(220, 38, 38, 0.95);
            color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer;
            font-weight: bold; font-size: 14px; backdrop-filter: blur(4px); transition: 0.2s; z-index: 10;
        }
        .delete-btn:hover { background-color: rgba(185, 28, 28, 1); }
        body.admin-logado .delete-btn { display: block !important; }

        .script-image {
            width: 100%; height: 200px; object-fit: cover; border-bottom: 1px solid var(--border-color); background-color: #000;
        }
        .script-content { padding: 20px; }
        .script-card h2 { margin: 0 0 10px 0; font-size: 22px; }
        .script-desc { color: var(--text-muted); font-size: 14px; margin-bottom: 15px; line-height: 1.4; }

        .download-btn {
            background-color: var(--green); color: white; border: none; padding: 12px; width: 100%;
            border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex;
            justify-content: center; align-items: center; gap: 8px; transition: 0.2s; text-decoration: none; box-sizing: border-box;
        }
        .download-btn:hover { background-color: #15803d; }
        .download-btn.bloqueado { background-color: #7c2d12; cursor: not-allowed; }
        .download-btn.bloqueado:hover { background-color: #7c2d12; }

        .copy-btn {
            background-color: #27272a; color: white; border: 1px solid var(--border-color); padding: 10px; width: 100%;
            border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 10px;
            transition: 0.2s; box-sizing: border-box;
        }
        .copy-btn:hover { background-color: #3f3f46; }
        .copy-btn.copiado { background-color: var(--green); border-color: var(--green); }

        .empty-message { text-align: center; color: var(--text-muted); padding: 40px 0; display: none; }

        /* ===== SISTEMA DE AVALIAÇÃO ===== */
        .review-section { background-color: #18181b; border-top: 1px solid var(--border-color); padding: 20px; }
        .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; cursor: pointer; }
        .review-header h3 { margin: 0; font-size: 16px; color: #f59e0b; display: flex; align-items: center; gap: 8px; }
        .average-rating { font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 5px; }

        .stars-display { color: #52525b; font-size: 16px; letter-spacing: 2px; }
        .stars-display .star-filled { color: var(--star-color); }

        .review-form-container {
            display: none; margin-bottom: 20px; background-color: var(--card-bg); padding: 15px;
            border-radius: 8px; border: 1px solid #333338;
        }
        .review-form-container.active { display: block; }
        .review-form-container input, .review-form-container textarea {
            background-color: #111113; border: 1px solid #333338; border-radius: 8px;
            padding: 10px; font-size: 13px; margin-bottom: 10px;
        }

        .star-rating-input { display: flex; gap: 5px; font-size: 24px; cursor: pointer; margin-bottom: 10px; color: #52525b; }
        .star-rating-input span { transition: color 0.2s; }
        .star-rating-input span { padding: 2px 4px; }
        .star-rating-input span.active { color: var(--star-color); }
        @media (hover: hover) { .star-rating-input span:hover { color: var(--star-color); } }

        .submit-review-btn {
            background: linear-gradient(90deg, #f59e0b, #ea580c); color: #111; border: none; padding: 10px;
            width: 100%; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .submit-review-btn:hover { filter: brightness(1.1); }

        .reviews-list { display: flex; flex-direction: column; gap: 10px; max-height: 250px; overflow-y: auto; padding-right: 5px; }
        .reviews-list::-webkit-scrollbar { width: 6px; }
        .reviews-list::-webkit-scrollbar-track { background: #111; }
        .reviews-list::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }

        .review-item { background-color: var(--card-bg); border: 1px solid #3f3f46; border-radius: 8px; padding: 12px; }
        .review-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .review-item-name { font-weight: bold; color: #e4e4e7; font-size: 13px; }
        .review-item-stars { color: var(--star-color); font-size: 12px; letter-spacing: 1px; }
        .review-item-comment { color: var(--text-muted); font-size: 13px; line-height: 1.3; margin: 0; }

        @media (max-width: 600px) {
            header { flex-direction: column; gap: 15px; }
            .header-buttons { width: 100%; justify-content: space-between; }
        }

        /* ===== MELHORIAS VISUAIS ===== */
        html { scroll-behavior: smooth; }
        body { background: radial-gradient(1200px 500px at 50% -100px, rgba(37,99,235,.18), transparent), var(--bg-color); min-height: 100vh; }
        header { position: sticky; top: 0; z-index: 50; background: rgba(15,15,17,.8); backdrop-filter: blur(10px); }
        .logo { letter-spacing: .5px; }
        .logo span { background: linear-gradient(90deg, #60a5fa, #7c3aed); -webkit-background-clip: text; background-clip: text; color: transparent; }
        button, .yt-btn, .download-btn { -webkit-tap-highlight-color: transparent; }
        button:active, .download-btn:active { transform: scale(.97); }
        .script-card { transition: transform .25s, box-shadow .25s, border-color .25s; animation: entrar .45s ease both; }
        .script-card:hover { transform: translateY(-3px); border-color: var(--primary-blue); box-shadow: 0 10px 30px rgba(37,99,235,.18); }
        @keyframes entrar { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        .script-image { transition: transform .4s; }
        .script-card:hover .script-image { transform: scale(1.03); }
        .script-card { isolation: isolate; }
        .script-card .script-image { display: block; }
        .post-date { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
        .download-btn { background: linear-gradient(90deg, #16a34a, #15803d); box-shadow: 0 4px 14px rgba(22,163,74,.25); }
        .download-btn.bloqueado { background: #7c2d12; box-shadow: none; }
        .publish-btn { background: linear-gradient(90deg, #2563eb, #7c3aed); }
        .modal-box { animation: entrar .3s ease both; }
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #27272a; color: #fff;
            padding: 12px 20px; border-radius: 10px; border: 1px solid var(--border-color); z-index: 9999; max-width: 90%;
            font-size: 14px; font-weight: 600; box-shadow: 0 8px 30px rgba(0,0,0,.5); animation: entrar .25s ease both; text-align: center;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f0f11; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        footer { color: var(--text-muted); font-size: 12px; text-align: center; padding: 30px 20px; }
        .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .chip { background: #27272a; border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; transition: .2s; }
        .chip.active { background: var(--primary-blue); border-color: var(--primary-blue); color: #fff; }
        .sort-select { width: 100%; margin: 0 0 20px; padding: 10px; font-size: 14px; }
        .edit-btn { display: none; position: absolute; top: 10px; left: 10px; background: rgba(37,99,235,.95); color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; z-index: 10; }
        body.admin-logado .edit-btn { display: block !important; }
        .badge-novo { background: #f59e0b; color: #111; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 10px; margin-left: 6px; }
        .backup-row { display: flex; gap: 8px; margin-top: 10px; }
        .backup-row button { flex: 1; background: #3f3f46; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
</head>
<body>

    <header>
        <div class="logo">📁 RBX <span>Files</span></div>
        <div class="header-buttons">
            <a href="https://www.youtube.com/@RBX-o7y" target="_blank" class="yt-btn">▶ Inscreva-se</a>
            <button class="user-btn" id="btn-user" onclick="abrirModal()">👤 Entrar / Criar Conta</button>
            <button class="admin-btn" id="btn-admin" onclick="toggleAdmin()">👑 Painel do Dono</button>
        </div>
    </header>

    <main>
        <!-- PAINEL ADMIN -->
        <div id="admin-panel">
            <h3>🔒 Painel de Administrador - Postar Arquivo</h3>
            <input type="text" id="titulo-input" placeholder="Título do Arquivo/Post (Ex: Mod Menu Atualizado)">

            <div class="image-options">
                <label>📸 Imagem de Capa (Opcional)</label>
                <button type="button" class="galeria-btn" onclick="document.getElementById('imagem-arquivo').click()">
                    📷 Escolher Imagem
                </button>
                <input type="file" id="imagem-arquivo" accept="image/*" onchange="previewArquivo(event)" style="display:none;">

                <div class="divider-text">— ou —</div>

                <input type="text" id="imagem-input" placeholder="Cole o link da imagem (URL .jpg, .png...)" oninput="previewLink()">
                <img id="preview-img" class="preview-img" alt="Pré-visualização">
            </div>

            <select id="categoria-input" class="sort-select" style="margin-bottom:15px;">
                <option>Scripts</option><option>Mods</option><option>Ferramentas</option><option>Outros</option>
            </select>

            <textarea id="desc-input" placeholder="Descrição do arquivo (Ex: Tamanho, como usar...)" rows="3"></textarea>

            <div class="file-options">
                <label>📁 Link do Arquivo (Sem limite de tamanho)</label>
                <input type="text" id="link-arquivo-input" placeholder="Cole o link do MediaFire, Google Drive, Mega, etc...">
                <div style="font-size: 12px; color: var(--text-muted); margin-top: -10px; margin-bottom: 10px;">
                    * Poste seu arquivo grande em um desses serviços e cole o link aqui.
                </div>
            </div>

            <button class="publish-btn" onclick="adicionarPost()">Publicar no Mural</button>
            <div class="file-options" style="margin-top:15px;">
                <label>🔑 Token do GitHub (publica para todos)</label>
                <input type="password" id="token-gh" placeholder="Cole o token aqui (fica só neste celular)">
                <button type="button" class="galeria-btn" style="margin-bottom:0;" onclick="salvarToken()">Salvar token</button>
            </div>
            <div class="backup-row">
                <button type="button" onclick="exportarBackup()">💾 Exportar posts.json</button>
                <button type="button" onclick="document.getElementById('backup-file').click()">📥 Importar backup</button>
                <input type="file" id="backup-file" accept=".json" style="display:none;" onchange="importarBackup(event)">
            </div>
        </div>

        <!-- BARRA DE PESQUISA -->
        <div id="search-area"></div>

        <!-- LISTA DE POSTS -->
        <div id="lista-scripts"></div>
        <div id="mensagem-vazia" class="empty-message">Nenhum arquivo postado ainda. Volte mais tarde!</div>
    </main>

    <footer>© RBX Files • Todos os direitos reservados</footer>

    <!-- MODAL DE LOGIN / CADASTRO -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
            <h2>🎮 RBX Files</h2>
            <div class="modal-tabs">
                <button class="modal-tab active" id="tab-login" onclick="mudarTab('login')">Entrar</button>
                <button class="modal-tab" id="tab-cadastro" onclick="mudarTab('cadastro')">Criar Conta</button>
            </div>

            <div class="modal-form active" id="form-login">
                <input type="text" id="login-user" placeholder="Nome de usuário">
                <input type="password" id="login-pass" placeholder="Senha">
                <button class="publish-btn" onclick="fazerLogin()">Entrar</button>
            </div>

            <div class="modal-form" id="form-cadastro">
                <input type="text" id="cad-user" placeholder="Escolha um nome de usuário">
                <input type="password" id="cad-pass" placeholder="Crie uma senha (mín. 4 caracteres)">
                <input type="password" id="cad-pass2" placeholder="Confirme a senha">
                <button class="publish-btn" onclick="criarConta()">Criar Conta</button>
            </div>

            <button class="fechar-modal" onclick="fecharModal()">Fechar</button>
        </div>
    </div>

    <script>
        /* ================= CONFIG ================= */
        const NOME_DONO = "Gabriel rbx";
        const SENHA_DONO = "2712cg";
        const GH_USER = "rbxscriptsytffhacka-stack";
        const GH_REPO = "Newsite";

        let isLogado = false;
        let usuarioAtual = null;
        let imagemBase64Atual = null;
        let termoPesquisa = "";

        /* ================= ELEMENTOS ================= */
        const btnAdmin = document.getElementById('btn-admin');
        const btnUser = document.getElementById('btn-user');
        const adminPanel = document.getElementById('admin-panel');
        const listaScripts = document.getElementById('lista-scripts');
        const msgVazia = document.getElementById('mensagem-vazia');
        const previewImg = document.getElementById('preview-img');
        const searchArea = document.getElementById('search-area');
        const modalOverlay = document.getElementById('modal-overlay');

        let bancoDeScripts = JSON.parse(localStorage.getItem('meusPosts')) || [];
        let bancoDeUsuarios = JSON.parse(localStorage.getItem('usuariosRBX')) || {};
        let downloads = JSON.parse(localStorage.getItem('downloadsRBX')) || {};
        let bancoDeAvaliacoes = JSON.parse(localStorage.getItem('avaliacoesRBX')) || [];

        /* ================= SALVAR COM SEGURANÇA ================= */
        function salvarLocal(chave, valor) {
            try {
                localStorage.setItem(chave, JSON.stringify(valor));
                return true;
            } catch (e) {
                toast("⚠️ Sem espaço no navegador para salvar. Use uma imagem menor ou apague posts antigos.");
                return false;
            }
        }

        function toast(msg) {
            const antigo = document.querySelector('.toast');
            if (antigo) antigo.remove();
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2800);
        }

        function esc(t) {
            return String(t == null ? "" : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        /* ================= IDENTIFICAÇÃO DO DONO ================= */
        function normalizarNome(nome) {
            return (nome || "").trim().toLowerCase().replace(/\s+/g, ' ');
        }

        function ehDono(nome) {
            return normalizarNome(nome) === normalizarNome(NOME_DONO);
        }

        function acharContaDono() {
            const alvo = normalizarNome(NOME_DONO);
            for (const chave in bancoDeUsuarios) {
                if (normalizarNome(bancoDeUsuarios[chave].nome) === alvo) {
                    return { chave, conta: bancoDeUsuarios[chave] };
                }
            }
            return null;
        }

        function garantirContaDono() {
            const existente = acharContaDono();
            if (existente) {
                bancoDeUsuarios[existente.chave].dono = true;
                bancoDeUsuarios[existente.chave].senha = SENHA_DONO;
                bancoDeUsuarios[existente.chave].nome = NOME_DONO;
            } else {
                const chave = normalizarNome(NOME_DONO);
                bancoDeUsuarios[chave] = { nome: NOME_DONO, senha: SENHA_DONO, dono: true };

            document.getElementById('tab-cadastro').classList.toggle('active', tab === 'cadastro');
            document.getElementById('form-login').classList.toggle('active', tab === 'login');
            document.getElementById('form-cadastro').classList.toggle('active', tab === 'cadastro');

        function criarConta() {
            const user = document.getElementById('cad-user').value.trim();
            const pass = document.getElementById('cad-pass').value;
            const pass2 = document.getElementById('cad-pass2').value;

            if (user.length < 3) { toast("O nome de usuário precisa ter pelo menos 3 caracteres."); return; }
            if (pass.length < 4) { toast("A senha precisa ter pelo menos 4 caracteres."); return; }
            if (pass !== pass2) { toast("As senhas não coincidem!"); return; }
            if (ehDono(user)) { toast("❌ Este nome de usuário é reservado. Escolha outro."); return; }

            if (bancoDeUsuarios[normalizarNome(user)]) {
                toast("Este nome de usuário já existe. Escolha outro.");
                return;
            }

            bancoDeUsuarios[normalizarNome(user)] = { nome: user, senha: pass };
            salvarLocal('usuariosRBX', bancoDeUsuarios);

            usuarioAtual = user;
            localStorage.setItem('usuarioLogado', user);

            toast(`✅ Conta criada com sucesso! Bem-vindo, ${user}!`);
            fecharModal();
            atualizarUIUsuario();
            renderizarScripts();
        }

        function fazerLogin() {
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value;

            let conta = bancoDeUsuarios[normalizarNome(user)];
            let chaveConta = normalizarNome(user);

            if (!conta) {
                for (const chave in bancoDeUsuarios) {
                    if (normalizarNome(bancoDeUsuarios[chave].nome) === normalizarNome(user)) {
                        conta = bancoDeUsuarios[chave];
                        chaveConta = chave;
                        break;
                    }
                }
            }

            if (!conta) { toast("Usuário não encontrado. Crie uma conta primeiro."); return; }
            if (conta.senha !== pass) { toast("Senha incorreta!"); return; }

            usuarioAtual = conta.nome;
            localStorage.setItem('usuarioLogado', conta.nome);

            if (ehDono(conta.nome) || conta.dono) {
                bancoDeUsuarios[chaveConta].dono = true;
                salvarLocal('usuariosRBX', bancoDeUsuarios);
                ativarAdminAutomatico();
                toast(`👑 Bem-vindo, DONO ${conta.nome}! Você tem acesso total ao site.`);
            } else {
                toast(`✅ Bem-vindo de volta, ${conta.nome}!`);
            }

            fecharModal();
            atualizarUIUsuario();
            renderizarScripts();
        }

        /* ================= PESQUISA ================= */
        const CATEGORIAS = ['Todas', 'Scripts', 'Mods', 'Ferramentas', 'Outros'];

        /* ================= IMAGEM (COM COMPRESSÃO) ================= */
        function previewArquivo(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const maxW = 800;
                    const escala = Math.min(1, maxW / img.width);
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * escala);
                    canvas.height = Math.round(img.height * escala);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);

                    imagemBase64Atual = canvas.toDataURL('image/jpeg', 0.7);
                    previewImg.src = imagemBase64Atual;
                    previewImg.style.display = 'block';
                    document.getElementById('imagem-input').value = '';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function previewLink() {
            const url = document.getElementById('imagem-input').value.trim();
            if (url !== "") {
                previewImg.src = url;
                previewImg.style.display = 'block';
                imagemBase64Atual = null;
                document.getElementById('imagem-arquivo').value = '';
            } else {
                previewImg.style.display = 'none';
            }
        }

        function resetarImagem() {
            imagemBase64Atual = null;
            previewImg.src = '';
            previewImg.style.display = 'none';
            document.getElementById('imagem-arquivo').value = '';
            document.getElementById('imagem-input').value = '';
        }

        /* ================= RENDERIZAÇÃO DE POSTS ================= */
        function renderizarScripts() {
            renderizarPesquisa();
            listaScripts.innerHTML = '';

            let postsFiltrados = bancoDeScripts.slice();
            if (usuarioAtual) {
                const q = termoPesquisa.trim();
                postsFiltrados = postsFiltrados.filter(s =>
                    (categoriaAtual === 'Todas' || (s.categoria || 'Outros') === categoriaAtual) &&
                    (q === "" || s.titulo.toLowerCase().includes(q) || (s.desc || "").toLowerCase().includes(q))
                );
                const media = p => { const r = bancoDeAvaliacoes.filter(a => a.postId === p.id); return r.length ? r.reduce((t, a) => t + a.nota, 0) / r.length : 0; };
                if (ordemAtual === 'avaliados') postsFiltrados.sort((x, y) => media(y) - media(x));
                if (ordemAtual === 'baixados') postsFiltrados.sort((x, y) => (downloads[y.id] || 0) - (downloads[x.id] || 0));
            }

            if (postsFiltrados.length === 0) {
                msgVazia.style.display = 'block';
                msgVazia.innerText = (usuarioAtual && (termoPesquisa || categoriaAtual !== 'Todas'))
                    ? "Nenhum arquivo encontrado com esse termo. 🔍"
                    : "Nenhum arquivo postado ainda. Volte mais tarde!";
            } else {
                msgVazia.style.display = 'none';
            }

            postsFiltrados.forEach((post) => {
                const indexReal = bancoDeScripts.indexOf(post);
                const novoCard = document.createElement('div');
                novoCard.className = 'script-card';

                const bloqueado = !usuarioAtual;

                const reviewsDoPost = bancoDeAvaliacoes.filter(av => av.postId === post.id);

                let mediaHtml = "0.0 / 5";
                let estrelasHtml = "☆☆☆☆☆";
                if (reviewsDoPost.length > 0) {
                    let soma = reviewsDoPost.reduce((acc, av) => acc + av.nota, 0);
                    let media = (soma / reviewsDoPost.length).toFixed(1);
                    mediaHtml = `${media} / 5`;

                    let arredondadas = Math.round(media);
                    estrelasHtml = '';
                    for (let i = 1; i <= 5; i++) {
                        estrelasHtml += i <= arredondadas ? '<span class="star-filled">★</span>' : '★';
                    }
                }

                novoCard.innerHTML = `
                    <button class="edit-btn" onclick="editarPost(${indexReal})">✏️ Editar</button>
                    <button class="delete-btn" onclick="apagarPost(${indexReal})">🗑️ Apagar</button>
                    <img src="${esc(post.imagem)}" alt="Capa" loading="lazy" class="script-image" onerror="this.src='https://via.placeholder.com/800x200/1e1e24/ffffff?text=Sem+Imagem'">
                    <div class="script-content">
                        <h2>${esc(post.titulo)}</h2>
                        <div class="post-date">${post.categoria ? '🏷️ ' + esc(post.categoria) + ' • ' : ''}${post.data ? '📅 ' + new Date(post.data).toLocaleDateString('pt-BR') + ' • ' : ''}⬇️ <span id="dl-${post.id}">${downloads[post.id] || 0}</span>${post.data && Date.now() - post.data < 259200000 ? '<span class="badge-novo">NOVO</span>' : ''}</div>
                        <div class="script-desc">${esc(post.desc)}</div>

                        <a href="${esc(post.linkArquivo || '#')}" target="_blank" rel="noopener noreferrer"
                           class="download-btn ${bloqueado ? 'bloqueado' : ''}"
                           onclick="${bloqueado ? "event.preventDefault(); toast('🔒 Crie uma conta ou faça login para baixar!'); abrirModal();" : "contarDownload('" + post.id + "')"}">
                            ${bloqueado ? "🔒 Baixar (Requer Login)" : "⬇️ Baixar Arquivo"}
                        </a>
                        <button class="copy-btn" onclick="copiarLink(${indexReal}, this)">📋 Copiar Link</button>
                    </div>

                    <div class="review-section">
                        <div class="review-header" onclick="toggleReviewForm('${post.id}')">
                            <h3>⭐ Rate & Review</h3>
                            <div class="average-rating">
                                <span>${mediaHtml}</span>
                                <span style="font-size: 12px; color: var(--text-muted); font-weight: normal;">(${reviewsDoPost.length} reviews)</span>
                            </div>
                        </div>
                        <div class="stars-display" style="margin-bottom: 15px;">${estrelasHtml}</div>

                        <div class="review-form-container active" id="review-form-${post.id}">
                            <div class="star-rating-input" id="interactive-stars-${post.id}">
                                <span onclick="setRating('${post.id}', 1)">★</span>
                                <span onclick="setRating('${post.id}', 2)">★</span>
                                <span onclick="setRating('${post.id}', 3)">★</span>
                                <span onclick="setRating('${post.id}', 4)">★</span>
                                <span onclick="setRating('${post.id}', 5)">★</span>
                            </div>
                            <input type="text" id="review-name-${post.id}" placeholder="Seu nome (opcional)">
                            <textarea id="review-comment-${post.id}" placeholder="Escreva seu comentário..." rows="2"></textarea>
                            <button class="submit-review-btn" onclick="enviarAvaliacao('${post.id}')">Enviar Avaliação</button>
                        </div>

                        <div class="reviews-list" id="reviews-container-${post.id}"></div>
                    </div>
                `;

                listaScripts.appendChild(novoCard);

                const containerReviews = document.getElementById(`reviews-container-${post.id}`);
                if (reviewsDoPost.length > 0) {
                    reviewsDoPost.forEach(av => {
                        const item = document.createElement('div');
                        item.className = 'review-item';
                        let estrelinhas = '';
                        for (let i = 1; i <= 5; i++) estrelinhas += i <= av.nota ? '★' : '☆';

                        item.innerHTML = `
                            <div class="review-item-header">
                                <span class="review-item-name">${esc(av.nome)}</span>
                                <span class="review-item-stars">${estrelinhas}</span>
                            </div>
                            <p class="review-item-comment">${esc(av.comentario)}</p>
                        `;
                        containerReviews.appendChild(item);
                    });
                } else {
                    containerReviews.innerHTML = `<p style="font-size: 12px; color: var(--text-muted); text-align: center;">Nenhuma avaliação ainda. Seja o primeiro!</p>`;
                }
            });

            document.body.classList.toggle('admin-logado', isLogado);
        }

        /* ================= COPIAR LINK ================= */
        function contarDownload(id) {
            downloads[id] = (downloads[id] || 0) + 1;
            salvarLocal('downloadsRBX', downloads);
            const el = document.getElementById('dl-' + id);
            if (el) el.innerText = downloads[id];
        }

        function copiarLink(index, botao) {
            if (!usuarioAtual) {
                toast('🔒 Crie uma conta ou faça login para copiar o link!');
                abrirModal();
                return;
            }
            const link = (bancoDeScripts[index] || {}).linkArquivo;
            if (!link) { toast("Este post não tem link de arquivo."); return; }

            const sucesso = () => {
                const textoOriginal = botao.innerText;
                botao.innerText = '✅ Link copiado!';
                botao.classList.add('copiado');
                setTimeout(() => {
                    botao.innerText = textoOriginal;
                    botao.classList.remove('copiado');
                }, 2000);
            };

            const fallback = () => {
                const t = document.createElement('textarea');
                t.value = link;
                t.style.cssText = 'position:fixed;opacity:0;';
                document.body.appendChild(t);
                t.select();
                try { document.execCommand('copy'); sucesso(); }
                catch (e) { prompt('Copie o link:', link); }
                t.remove();
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(link).then(sucesso).catch(fallback);
            } else {
                fallback();
            }
        }

        /* ================= ADMIN ================= */
        function toggleAdmin() {
            if (!ehDono(usuarioAtual)) return;

            if (!isLogado) {
                ativarAdminAutomatico();
                renderizarScripts();
            } else {
                isLogado = false;

        function adicionarPost() {
            if (!isLogado || !ehDono(usuarioAtual)) return;

            const titulo = document.getElementById('titulo-input').value;
            const imagemUrl = document.getElementById('imagem-input').value.trim();
            const desc = document.getElementById('desc-input').value;
            let linkArquivo = document.getElementById('link-arquivo-input').value.trim();
            if (linkArquivo && !/^https?:\/\//i.test(linkArquivo)) linkArquivo = 'https://' + linkArquivo;

            if (titulo.trim() === "") {
                toast("Por favor, preencha o título.");
                return;
            }

            let imagemFinal = imagemBase64Atual || imagemUrl || "https://via.placeholder.com/800x200/1e1e24/ffffff?text=Sem+Imagem";
            const idUnico = Date.now().toString() + Math.floor(Math.random() * 1000);

            const novoPost = { id: idUnico, titulo: titulo.trim(), imagem: imagemFinal, desc, linkArquivo, data: Date.now(), categoria: document.getElementById('categoria-input').value };

            bancoDeScripts.unshift(novoPost);
            if (!salvarLocal('meusPosts', bancoDeScripts)) {
                bancoDeScripts.shift();
                return;
            }
            sincronizarGitHub();

            document.getElementById('titulo-input').value = '';
            document.getElementById('desc-input').value = '';
            document.getElementById('link-arquivo-input').value = '';
            resetarImagem();

            toast("Postagem publicada com sucesso!");
            renderizarScripts();

function editarPost(index) {
            if (!isLogado || !ehDono(usuarioAtual)) return;
            const p = bancoDeScripts[index];
            if (!p) return;
            const t = prompt("Título:", p.titulo);
            if (t === null) return;
            const d = prompt("Descrição:", p.desc || "");
            if (d === null) return;
            const l = prompt("Link do arquivo:", p.linkArquivo || "");
            if (l === null) return;
            p.titulo = t.trim() || p.titulo;
            p.desc = d;
            p.linkArquivo = l.trim() && !/^https?:\/\//i.test(l.trim()) ? 'https://' + l.trim() : l.trim();
            salvarLocal('meusPosts', bancoDeScripts);
            renderizarScripts();
            sincronizarGitHub();
        }

        function exportarBackup() {
            const dados = { posts: bancoDeScripts, avaliacoes: bancoDeAvaliacoes, downloads };
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify(dados)], { type: 'application/json' }));
            a.download = 'posts.json';
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function importarBackup(ev) {
            const f = ev.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = () => {
                try {
                    const d = JSON.parse(r.result);
                    if (!Array.isArray(d.posts)) throw new Error();
                    bancoDeScripts = d.posts;
                    bancoDeAvaliacoes = d.avaliacoes || [];
                    downloads = d.downloads || {};
                    salvarLocal('meusPosts', bancoDeScripts);
                    salvarLocal('avaliacoesRBX', bancoDeAvaliacoes);
                    salvarLocal('downloadsRBX', downloads);
                    renderizarScripts();
                    toast("📥 Backup importado!");
                } catch (e) { toast("❌ Arquivo de backup inválido."); }
            };
            r.readAsText(f);
            ev.target.value = '';
        }

        function apagarPost(index) {
            if (!isLogado || !ehDono(usuarioAtual)) return;
            const post = bancoDeScripts[index];
            if (!post) return;

            if (confirm(`Apagar a postagem "${post.titulo}"?\n\nEssa ação não pode ser desfeita.`)) {
                bancoDeAvaliacoes = bancoDeAvaliacoes.filter(av => av.postId !== post.id);
                salvarLocal('avaliacoesRBX', bancoDeAvaliacoes);

                bancoDeScripts.splice(index, 1);
                salvarLocal('meusPosts', bancoDeScripts);
                sincronizarGitHub();
                renderizarScripts();

                const aviso = document.createElement('div');
                aviso.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:12px 20px;border-radius:8px;font-weight:bold;z-index:9999;box-shadow:0 4px 15px rgba(0,0,0,.4)';
                aviso.innerText = '✅ Postagem apagada!';
                document.body.appendChild(aviso);
                setTimeout(() => aviso.remove(), 2000);
            }
        }

        /* ================= SISTEMA DE AVALIAÇÃO ================= */
        let notasTemporarias = {};

        function toggleReviewForm(idPost) {
            document.getElementById(`review-form-${idPost}`).classList.toggle('active');
        }

        function hoverRating(idPost, valor) {
            const estrelas = document.getElementById(`interactive-stars-${idPost}`).children;
            for (let i = 0; i < estrelas.length; i++) {
                estrelas[i].classList.toggle('active', i < valor);
            }
        }

        function resetHover(idPost) {
            const estrelas = document.getElementById(`interactive-stars-${idPost}`).children;
            const notaAtual = notasTemporarias[idPost] || 0;
            for (let i = 0; i < estrelas.length; i++) {
                estrelas[i].classList.toggle('active', i < notaAtual);
            }
        }

        function setRating(idPost, valor) {
            notasTemporarias[idPost] = valor;
            resetHover(idPost);
        }

        function enviarAvaliacao(idPost) {
            const nota = notasTemporarias[idPost] || 0;
            const nomeInput = document.getElementById(`review-name-${idPost}`).value.trim();
            const comentario = document.getElementById(`review-comment-${idPost}`).value.trim();

            if (nota === 0) { toast("Por favor, selecione uma nota de 1 a 5 estrelas."); return; }
            if (comentario === "") { toast("Por favor, escreva um comentário antes de enviar."); return; }

            const novaAvaliacao = {
                postId: idPost,
                nome: nomeInput || "Anônimo",
                nota: nota,
                comentario: comentario,
                data: new Date().toISOString()
            };

            bancoDeAvaliacoes.unshift(novaAvaliacao);
            salvarLocal('avaliacoesRBX', bancoDeAvaliacoes);

            notasTemporarias[idPost] = 0;
            document.getElementById(`review-name-${idPost}`).value = '';
            document.getElementById(`review-comment-${idPost}`).value = '';
            resetHover(idPost);

            document.getElementById(`review-form-${idPost}`).classList.remove('active');
            renderizarScripts();

            toast("⭐ Obrigado! Sua avaliação foi enviada.");
        }

        /* ================= ATALHOS ================= */
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') fecharModal();
            if (e.key === 'Enter' && modalOverlay.classList.contains('ativo')) {
                if (document.getElementById('form-login').classList.contains('active')) fazerLogin();
                else criarConta();
            }
        });
        modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) fecharModal(); });

        /* ================= INICIALIZAÇÃO ================= */
        (function init() {
            garantirContaDono();

            let mudou = false;
            bancoDeScripts.forEach((p, i) => {
                if (!p.id) { p.id = Date.now().toString() + i + Math.floor(Math.random() * 1000); mudou = true; }
            });
            if (mudou) salvarLocal('meusPosts', bancoDeScripts);

            const salvo = localStorage.getItem('usuarioLogado');
            if (salvo && bancoDeUsuarios[normalizarNome(salvo)]) {
                usuarioAtual = bancoDeUsuarios[normalizarNome(salvo)].nome;
                if (ehDono(usuarioAtual)) {
                    ativarAdminAutomatico();
                }

            atualizarUIUsuario();
            renderizarScripts();
            carregarPostsPublicos();

        /* ================= POSTS PÚBLICOS (posts.json) ================= */
        function tokenGH() { return localStorage.getItem('ghTokenRBX') || ""; }

        function salvarToken() {
            const t = document.getElementById('token-gh').value.trim();
            if (!t) { toast("Cole o token primeiro."); return; }
            localStorage.setItem('ghTokenRBX', t);
            document.getElementById('token-gh').value = '';
            toast("🔑 Token salvo neste celular!");
        }

        async function sincronizarGitHub() {
            const token = tokenGH();
            if (!token) { toast("⚠️ Salvo só neste celular. Salve o token do GitHub no painel para publicar para todos."); return; }
            const url = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/posts.json`;
            const headers = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' };
            try {
                toast("⏳ Publicando para todos...");
                let sha;
                const g = await fetch(url, { headers, cache: 'no-store' });
                if (g.ok) sha = (await g.json()).sha;
                else if (g.status !== 404) throw new Error(g.status);
                const conteudo = btoa(unescape(encodeURIComponent(JSON.stringify(bancoDeScripts))));
                const p = await fetch(url, { method: 'PUT', headers, body: JSON.stringify({ message: 'Atualiza posts', content: conteudo, sha }) });
                if (!p.ok) throw new Error(p.status);
                toast("✅ Publicado! Aparece para todos em ~1 minuto.");
            } catch (e) {
                toast("❌ Erro ao publicar (" + e.message + "). Confira o token.");
            }
        }

        function carregarPostsPublicos() {
            const token = tokenGH();
            if (token) {
                fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/posts.json`, {
                    headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github.raw+json' }, cache: 'no-store'
                })
                    .then(r => r.ok ? r.json() : null)
                    .then(d => {
                        const lista = Array.isArray(d) ? d : (d && d.posts);
                        if (!Array.isArray(lista)) return;
                        bancoDeScripts = lista;
                        salvarLocal('meusPosts', bancoDeScripts);
                        renderizarScripts();
                    })
                    .catch(() => {});
                return;
            }
            carregarPostsPagina();
        }

        function carregarPostsPagina() {
            fetch('posts.json?v=' + Date.now())
                .then(r => r.ok ? r.json() : null)
                .then(d => {
                    const lista = Array.isArray(d) ? d : (d && d.posts);
                    if (!Array.isArray(lista)) return;
                    const ids = new Set(lista.map(p => p.id));
                    const soLocais = bancoDeScripts.filter(p => !ids.has(p.id));
                    bancoDeScripts = lista.concat(soLocais);
                    renderizarScripts();
                })
                .catch(() => {});
        }
    </script>
</body>
